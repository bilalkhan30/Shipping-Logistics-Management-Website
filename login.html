<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Logistics Portal Login</title>
    <link rel="stylesheet" href="css/style.css" />
    <link
      href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <header class="main-header">
      <div class="logo">
        <img src="./assets/logo.jpg" alt="Company Logo" />
        <h1>Azimar Shipping & Logistics</h1>
      </div>
      <nav class="main-nav">
        <a href="index.html">Home</a>
        <a href="about.html">About</a>
        <a href="contact.html">Contact</a>
      </nav>
    </header>

    <main class="login-container">
      <div class="login-box">
        <h2 class="animated">Login to Your Account</h2>

        <form class="login-form" id="login-form">
          <div class="input-group animated">
            <label for="email">Email Address</label>
            <input type="email" id="email" name="email" required />
          </div>
          <div class="input-group animated">
            <label for="password">Password</label>
            <input type="password" id="password" name="password" required />
          </div>

          <div class="form-options animated">
            <div class="forgot-password">
              <a href="#">Forgot Password?</a>
            </div>
          </div>

          <p id="login-error" class="error-message"></p>

          <button type="submit" class="login-button animated">Login</button>
        </form>

        <div class="signup-link animated">
          <p>Don't have an account? <a href="signup.html">Sign Up</a></p>
        </div>
      </div>
    </main>

    <footer class="main-footer">
      <p>&copy; 2023 Azimar Shipping & Logistics. All rights reserved.</p>
    </footer>

    <script src="js/login.js"></script>
  </body>
</html>
