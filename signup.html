<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sign Up - LogisticsPro</title>
    <link rel="stylesheet" href="css/style.css" />
    <link rel="stylesheet" href="css/signup.css" />
    <link
      href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <header class="main-header">
      <div class="logo">
        <img src="./assets/logo.jpg" alt="Company Logo" />
        <h1>Azimar Shipping & Logistics</h1>
      </div>

      <nav class="main-nav">
        <a href="about.html">About</a>
        <a href="contact.html">Contact</a>
        <a href="login.html">Login</a>
      </nav>
    </header>

    <main class="signup-container">
      <div class="signup-box">
        <h2>Create Your Account</h2>

        <form class="signup-form" id="signup-form">
          <div class="input-group">
            <label for="fullname">Full Name</label>
            <input type="text" id="fullname" name="fullname" required />
          </div>
          <div class="input-group">
            <label for="email">Email Address</label>
            <input type="email" id="email" name="email" required />
          </div>
          <div class="input-group">
            <label for="phone">Phone Number</label>
            <input type="tel" id="phone" name="phone" required />
          </div>
          <div class="input-group">
            <label for="user-role">I am a:</label>
            <select id="user-role" name="user-role" required>
              <option value="">Please select a role...</option>
              <option value="customer">Customer</option>
              <option value="supplier">Supplier</option>
              <option value="transporter">Transporter</option>
            </select>
          </div>
          <div class="input-group">
            <label for="password">Password</label>
            <input type="password" id="password" name="password" required />
          </div>
          <div class="input-group">
            <label for="confirm-password">Confirm Password</label>
            <input
              type="password"
              id="confirm-password"
              name="confirm-password"
              required
            />
          </div>

          <p id="signup-message" class="message-holder"></p>

          <button type="submit" class="signup-button">Create Account</button>
        </form>

        <div class="login-link">
          <p>Already have an account? <a href="index.html">Login</a></p>
        </div>
      </div>
    </main>

    <footer class="main-footer">
      <p>&copy; 2023 Azimar Shipping & Logistics. All rights reserved.</p>
    </footer>

    <script src="js/signup.js"></script>
  </body>
</html>
